[[items]]
title = "学术交流"
subtitle = "青年地学论坛 · 复旦大学暑期学校"
content = "参加第十一届青年地学论坛并作学术汇报。参加复旦大学历史地理研究中心第十七届“区域历史地理研究的理论与进展”和第十八届“历史地理的考证传统和数智转型”两期暑期学校。"

[[items]]
title = "课程助教"
subtitle = "《遥感概论》·《遥感软件应用技术》"
content = "担任两门课程助教；在助教课堂围绕“AI 与人的关系”开展专题教学与讨论。"

[[items]]
title = "期刊审稿"
subtitle = "IJGIS · JRS · npj Heritage Science"
content = "担任 International Journal of Geographical Information Science（IJGIS）、JRS、npj Heritage Science 审稿人。"

[[items]]
title = "十五运会志愿服务"
content = "参与中华人民共和国第十五届运动会志愿服务。"

[[items]]
title = "广东省青年联合会实习"
content = "参与公众号内容制作与编辑排版。"

[[items]]
title = "学生工作与社会调研组织"
content = "曾任华南师范大学校团委青年文化中心副主任、干事，参与“华南师大紫荆青年”公众号运营。担任地理科学学院青心砺行实践队队长，组织 2022 年暑期“三下乡”调研；两次担任寒假招生宣传队长，并担任寒假社会实践调研队长。"
