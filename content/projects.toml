[[items]]
title = "Reconstructing Lingnan rural spatial memory and cultural revitalisation pathways through historical maps"
subtitle = "Project lead · Guangdong Special Fund for Science and Technology Innovation Strategy (Student Innovation Cultivation)"
date = "2026"
content = "**CNY 30,000; one of 15 projects approved university-wide.** Funded by the Department of Science and Technology of Guangdong Province and the Guangdong Provincial Committee of the Communist Youth League. Integrates historical maps, local gazetteers, remote-sensing imagery and oral histories to reconstruct village public spaces and cultural memory, and explore memory preservation and cultural revitalisation."
tags = ["Historical maps", "Rural public space", "Cultural memory"]

[[items]]
title = "Historical map database construction and landscape pattern evolution in the Pearl River Delta since the Qing Dynasty"
subtitle = "First-ranked student participant · Guangdong Philosophy and Social Sciences Planning, Rare and Endangered Disciplines Programme"
date = "2025 programme"
content = "**Project GD25LMZTS01; CNY 50,000; principal investigator: Guilin Liu.** Independently wrote the funding proposal, reviewed the literature, refined the research questions and designed the technical approach. Participates in historical map feature identification, spatiotemporal database construction, field investigation and analysis of landscape evolution mechanisms."
tags = ["Historical GIS", "Spatiotemporal databases", "Landscape evolution"]

[[items]]
title = "A keyboard system for pixel-level semantic-segmentation annotation of remote-sensing images"
subtitle = "Team member (third-ranked) · SCNU Golden Seed extracurricular student research programme"
date = "2025–2026"
content = "Developed for image annotation in ArcMap, the project combines a microcontroller with USB HID keyboard and mouse emulation to integrate vertex construction, viewport following and step-size switching into a dedicated keyboard.\n\n**My contribution:** Early testing, human–computer interaction feature design and later testing.\n\n**Project outputs:** Three physical prototypes, one control programme and one utility-model patent arising from the project; passed the completion review in June 2026."
tags = ["Human–computer interaction", "Remote-sensing annotation", "USB HID"]

[[items]]
title = "Effects of multi-year cotton planting patterns on yield through assimilation of optical remote sensing and crop models"
subtitle = "Project participant · National Natural Science Foundation of China, General Programme"
date = "2023.01–2026.12"
content = "**Grant 42271346; principal investigator: Guilin Liu.** Integrates optical remote sensing and crop models to study how multi-year cotton planting patterns affect crop growth and yield. Wrote approximately 30%–40% of the proposal and contributed image-sample annotation and data processing during project implementation."
tags = ["Optical remote sensing", "Crop modelling", "Cotton cultivation"]

[[items]]
title = "Spatiotemporal trade-offs and synergies among water, food and cotton, and optimisation of grain–cotton planting patterns in arid regions"
subtitle = "Project participant · National Natural Science Foundation of China"
date = "2027.01–2030.12"
content = "**Scheduled project period: January 2027–December 2030; principal investigator: Guilin Liu.** Wrote approximately 50%–60% of the proposal, joined discussions of the core scientific questions, and contributed preparatory work including remote-sensing image annotation and data processing."
tags = ["Spatiotemporal trade-offs", "Planting patterns", "Preparatory work"]

[[items]]
title = "Tracing roots and building belonging: diagnosing and repairing ruptures in Lingnan rural spatial memory through GIS and oral history"
subtitle = "Project member · SCNU School of Geography Zhouji Innovation and Entrepreneurship Incubation Programme"
date = "2026"
content = "**Project DKZJ202606; project lead: Zhixuan Dong.** Combines maps from multiple periods, remote-sensing imagery, village gazetteers and oral histories to locate ruptures in the memory of village public spaces, examine links with place identity and community cohesion, and explore ways to repair cultural memory. Guided the overall research approach and framework; the project grew out of the Climbing Programme project I lead."
tags = ["GIS and oral history", "Place identity", "Cultural memory"]

[[items]]
title = "Abandoned-cropland identification and driver analysis using long-term remote-sensing imagery in cloudy, rainy subtropical regions"
subtitle = "Second project lead · Student Innovation and Entrepreneurship Training Programme"
date = "Undergraduate studies"
content = "Contributed research reports, Google Earth Engine code, field investigation and the final presentation. The project received an Excellent completion rating. Provided the abandoned-cropland identification algorithm based on cultivated/uncultivated binary maps for the JAG article."
tags = ["Remote-sensing time series", "Google Earth Engine", "Excellent completion"]
