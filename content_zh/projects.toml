[[items]]
title = "图见百千万：基于历史地图的岭南乡村空间记忆重构与文化振兴路径研究"
subtitle = "主持 · 广东省科技创新战略专项资金（大学生科技创新培育）项目"
date = "2026"
content = "**资助 3 万元；全校仅立项 15 项。** 立项部门为广东省科技厅、共青团广东省委员会。融合历史地图、地方志、遥感影像与口述史，重构岭南乡村公共空间与文化记忆，探索空间记忆保护和文化振兴路径。"
tags = ["历史地图", "乡村公共空间", "文化记忆"]

[[items]]
title = "清代以来珠江三角洲古地图数据库构建与景观格局演化研究"
subtitle = "学生参与者排名第一 · 广东省哲学社会科学规划冷门绝学研究专项"
date = "2025 年度"
content = "**项目编号：GD25LMZTS01；资助 5 万元；负责人：刘桂林。** 独立完成项目申报书撰写，开展文献梳理、研究问题凝练及技术路线设计；参与古地图要素识别与时空数据库构建、实地考察及景观格局演化机制分析。"
tags = ["历史 GIS", "时空数据库", "景观演化"]

[[items]]
title = "用于遥感图像像素级图像语义分割标签制作的键盘系统"
subtitle = "课题组成员（排名第三）· 华南师范大学学生课外科研金种子一般课题"
date = "2025–2026"
content = "面向 ArcMap 遥感图像标注，基于单片机与 USB HID 键鼠模拟，将折点构造、视图跟随和步长切换整合为专用键盘操作。\n\n**主要工作：** 参与前期测试、人机交互功能设计及后期测试。\n\n**课题成果：** 形成 3 套实物样机及 1 套控制程序，孵化实用新型专利 1 项；2026 年 6 月结项。示例测试中，规整条田标注用时由 40 分钟缩短至 15 分钟，不规则阶梯形条田由超过 1 小时缩短至 20 分钟。"
tags = ["人机交互", "遥感标注", "USB HID"]

[[items]]
title = "同化光学遥感与作物模型的棉花多年种植模式对产量的影响机制研究"
subtitle = "项目参与 · 国家自然科学基金面上项目"
date = "2023.01–2026.12"
content = "**批准号：42271346；负责人：刘桂林。** 融合光学遥感与作物模型，研究棉花多年种植模式对作物生长及产量的影响。承担约 20%–30% 的项目申报书撰写；在项目执行阶段参与野外采样、遥感影像样本标注、数据处理等工作。"
tags = ["光学遥感", "作物模型", "棉花种植"]

[[items]]
title = "干旱区“水-粮-棉”时空权衡协同机制与粮棉种植模式优化"
subtitle = "项目参与 · 国家自然科学基金面上项目"
date = "2027.01–2030.12"
content = "**批准号：42671376；项目执行期：2027 年 1 月至 2030 年 12 月；负责人：刘桂林。** 承担约 50%–60% 的项目申报书撰写，参与核心科学问题的讨论，以及遥感影像样本标注、数据处理等前期准备工作。"
tags = ["时空权衡与协同", "种植模式", "前期准备"]

[[items]]
title = "寻脉与凝心：岭南乡村空间记忆“断裂点”的社会诊断与修复路径——基于 GIS 与口述史的混合调查"
subtitle = "项目成员 · 华南师范大学地理科学学院“洲际”创新创业培育计划"
date = "2026"
content = "**项目编号：DKZJ202606；负责人：董祉暄。** 结合多期地图、遥感影像、村志与口述史，定位乡村公共空间的记忆断裂点，分析空间变化与地方认同、社区凝聚力的关系，探索文化记忆修复路径。指导项目总体研究思路与框架梳理；该项目由本人主持的广东省资助历史地图项目（见上文）延伸培育。"
tags = ["GIS 与口述史", "地方认同", "文化记忆"]

[[items]]
title = "基于长时序遥感影像的亚热带多云多雨地区撂荒耕地识别与影响机制探究"
subtitle = "第二负责人 · 大学生创新创业训练计划"
date = "2022.04–2023.04"
content = "参与研究报告撰写、Google Earth Engine 代码编写、实地考察及结项答辩；项目结项评级优秀。为 JAG 论文提供基于耕地／未耕地二元图的撂荒耕地识别算法代码。"
tags = ["遥感时序", "Google Earth Engine", "优秀结项"]
